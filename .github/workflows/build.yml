name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl  # binário estático, sem dependências

jobs:
  build-rust:
    name: Build Rust (cartola-api + cartola-scraper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instala Rust + target musl
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ hashFiles('Cargo.lock') }}

      - name: Instala cross-linker musl
        run: sudo apt-get install -y musl-tools

      - name: Build cartola-api
        run: cargo build --release --target ${{ env.TARGET }} -p cartola-api

      - name: Build cartola-scraper
        run: cargo build --release --target ${{ env.TARGET }} -p cartola-scraper

      - name: Upload binários Rust
        uses: actions/upload-artifact@v4
        with:
          name: rust-bins
          path: |
            target/${{ env.TARGET }}/release/cartola-api
            target/${{ env.TARGET }}/release/cartola-scraper

  build-go:
    name: Build Go (broker + deployer + watchdog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: broker/go.mod

      - name: Baixa dependências do broker
        working-directory: broker
        run: go mod tidy

      - name: Build broker
        working-directory: broker
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1  # necessário para go-sqlite3
        run: go build -ldflags="-s -w" -o broker .

      - name: Build deployer
        working-directory: deployer
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o deployer .

      - name: Build watchdog
        working-directory: watchdog
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o watchdog .

      - name: Upload binários Go
        uses: actions/upload-artifact@v4
        with:
          name: go-bins
          path: |
            broker/broker
            deployer/deployer
            watchdog/watchdog

  deploy:
    name: Deploy na VM
    needs: [build-rust, build-go]
    runs-on: ubuntu-latest
    steps:
      - name: Baixa todos os binários
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./bins

      - name: Envia para o deployer via webhook
        run: |
          tar -czf release.tar.gz -C bins .
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -F "release=@release.tar.gz" \
            "https://${{ secrets.VM_DOMAIN }}/deploy"
